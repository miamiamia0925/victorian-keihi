<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>販売報告 | ヴィクトリアンカフェ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap');

  :root {
    --ivory:    #F8F4EE;
    --parchment:#EDE6D8;
    --gold:     #B89A5C;
    --gold-lt:  #D4B97A;
    --brown:    #4A3728;
    --brown-md: #7A5C42;
    --brown-lt: #A07850;
    --ink:      #2C1F14;
    --muted:    #8A7060;
    --border:   #D4C4AE;
    --shadow:   rgba(74,55,40,0.10);
    --green:    #4A7856;
    --red:      #8B3A3A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--parchment);
    font-family: 'Noto Sans JP', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 16px 48px;
  }

  /* ── Header ── */
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  .logo-line {
    font-family: 'Noto Serif JP', serif;
    font-size: 11px;
    letter-spacing: 0.35em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--brown);
    letter-spacing: 0.12em;
  }
  .header-rule {
    display: flex; align-items: center; gap: 12px;
    margin: 10px auto 0; max-width: 320px;
  }
  .header-rule::before, .header-rule::after {
    content: ''; flex: 1; height: 1px; background: var(--gold);
  }
  .header-rule span { color: var(--gold); font-size: 14px; }

  /* ── Card ── */
  .card {
    background: var(--ivory);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 20px;
    margin-bottom: 14px;
    box-shadow: 0 2px 10px var(--shadow);
  }
  .card-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 12px;
    letter-spacing: 0.25em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-title::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  /* ── Labels / Inputs ── */
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
    margin-bottom: 5px;
    margin-top: 14px;
  }
  label:first-of-type { margin-top: 0; }

  input[type="text"],
  input[type="number"],
  input[type="time"],
  textarea,
  select {
    width: 100%;
    padding: 10px 13px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #FFFFFF;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 15px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(184,154,92,0.12);
  }

  .time-row {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center;
  }
  .time-sep {
    font-size: 18px; color: var(--muted); text-align: center; padding-top: 2px;
  }

  .amount-wrap {
    position: relative;
  }
  .amount-wrap input {
    padding-left: 30px;
  }
  .amount-prefix {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 15px; pointer-events: none;
  }

  textarea.report-area {
    min-height: 130px;
    resize: vertical;
    line-height: 1.8;
  }

  /* ── Shipping items ── */
  .ship-list { display: flex; flex-direction: column; gap: 8px; }
  .ship-item {
    display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center;
  }
  .ship-item input[type="number"] { width: 64px; text-align: center; }
  .ship-unit {
    font-size: 13px; color: var(--muted); white-space: nowrap;
  }
  .btn-remove {
    background: none; border: none; cursor: pointer;
    color: var(--red); font-size: 18px; padding: 0 4px; line-height: 1;
    opacity: 0.6; transition: opacity 0.15s;
  }
  .btn-remove:hover { opacity: 1; }
  .btn-add {
    margin-top: 10px;
    display: inline-flex; align-items: center; gap: 6px;
    background: none;
    border: 1px dashed var(--gold-lt);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    color: var(--brown-lt);
    cursor: pointer;
    width: 100%;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn-add:hover { background: rgba(184,154,92,0.08); border-color: var(--gold); }

  /* ── Submit ── */
  .btn-submit {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, var(--brown) 0%, var(--brown-md) 100%);
    color: var(--ivory);
    border: none;
    border-radius: 8px;
    font-family: 'Noto Serif JP', serif;
    font-size: 16px;
    letter-spacing: 0.2em;
    cursor: pointer;
    margin-top: 8px;
    box-shadow: 0 3px 12px rgba(74,55,40,0.25);
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn-submit:hover { opacity: 0.88; }
  .btn-submit:active { transform: scale(0.98); }

  /* ── Success modal ── */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(44,31,20,0.55); backdrop-filter: blur(3px);
    z-index: 100; align-items: center; justify-content: center;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--ivory);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 28px;
    text-align: center;
    max-width: 320px; width: 90%;
    box-shadow: 0 8px 32px rgba(44,31,20,0.25);
    animation: popIn 0.25s ease;
  }
  @keyframes popIn {
    from { transform: scale(0.88); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
  }
  .modal-icon { font-size: 40px; margin-bottom: 12px; }
  .modal h2 {
    font-family: 'Noto Serif JP', serif;
    font-size: 18px; color: var(--brown); margin-bottom: 8px;
  }
  .modal p { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 20px; }
  .modal-time { font-size: 12px; color: var(--gold); letter-spacing: 0.1em; }
  .btn-modal {
    background: var(--brown); color: var(--ivory);
    border: none; border-radius: 6px; padding: 10px 28px;
    font-family: 'Noto Sans JP', sans-serif; font-size: 14px;
    cursor: pointer; transition: opacity 0.2s;
  }
  .btn-modal:hover { opacity: 0.8; }

  /* ── Preview section ── */
  #preview-wrap {
    display: none;
    background: var(--ivory);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-top: 14px;
    box-shadow: 0 2px 10px var(--shadow);
    white-space: pre-wrap;
    font-size: 13px;
    line-height: 1.9;
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
  }
  .preview-label {
    font-family: 'Noto Serif JP', serif;
    font-size: 11px;
    letter-spacing: 0.25em;
    color: var(--gold);
    margin-bottom: 10px;
    display: block;
  }
  .copy-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; margin-top: 12px;
    padding: 10px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px; color: var(--brown-lt);
    cursor: pointer; transition: background 0.15s;
  }
  .copy-btn:hover { background: rgba(184,154,92,0.08); }
</style>
</head>
<body>

<header>
  <p class="logo-line">Victorian Café · 株式会社ハイクオリティー</p>
  <h1>販売日報</h1>
  <div class="header-rule"><span>✦</span></div>
</header>

<!-- 担当者 & 出勤時間 -->
<div class="card">
  <p class="card-title">担当者 / 勤務時間</p>

  <label>担当者名</label>
  <input type="text" id="staff" placeholder="例：山田 花子">

  <label>出勤時間</label>
  <div class="time-row">
    <input type="time" id="time-from" value="11:30">
    <span class="time-sep">〜</span>
    <input type="time" id="time-to" value="18:00">
  </div>
</div>

<!-- 売上 -->
<div class="card">
  <p class="card-title">売上報告</p>

  <label>売上金額（円）</label>
  <div class="amount-wrap">
    <span class="amount-prefix">¥</span>
    <input type="number" id="sales" placeholder="0" min="0" step="1">
  </div>
</div>

<!-- 今日の報告 -->
<div class="card">
  <p class="card-title">今日の報告</p>

  <label>報告内容</label>
  <textarea class="report-area" id="report" placeholder="接客状況・商品の反応・気づいたこと など&#10;自由にご記入ください"></textarea>
</div>

<!-- 追加発送依頼 -->
<div class="card">
  <p class="card-title">追加発送依頼</p>

  <div class="ship-list" id="ship-list">
    <div class="ship-item">
      <input type="text" placeholder="商品名（例：ケーキ缶 抹茶）">
      <input type="number" placeholder="0" min="0" style="width:64px;text-align:center;">
      <span class="ship-unit">個</span>
      <button class="btn-remove" onclick="removeItem(this)" title="削除">×</button>
    </div>
  </div>

  <button class="btn-add" onclick="addItem()">＋ 商品を追加</button>
</div>

<!-- 送信ボタン -->
<button class="btn-submit" onclick="submitReport()">日報を完成させる</button>

<!-- プレビュー -->
<div id="preview-wrap">
  <span class="preview-label">REPORT PREVIEW</span>
  <div id="preview-text"></div>
  <button class="copy-btn" onclick="copyText()">📋 テキストをコピー</button>
</div>

<!-- 完了モーダル -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-icon">✅</div>
    <h2>日報を作成しました</h2>
    <p>下のプレビューからテキストをコピーして、LINEやメールで送信してください。</p>
    <p class="modal-time" id="modal-time"></p>
    <br>
    <button class="btn-modal" onclick="closeModal()">確認する</button>
  </div>
</div>

<script>
  function addItem() {
    const list = document.getElementById('ship-list');
    const div = document.createElement('div');
    div.className = 'ship-item';
    div.innerHTML = `
      <input type="text" placeholder="商品名">
      <input type="number" placeholder="0" min="0" style="width:64px;text-align:center;">
      <span class="ship-unit">個</span>
      <button class="btn-remove" onclick="removeItem(this)" title="削除">×</button>
    `;
    list.appendChild(div);
    div.querySelector('input[type="text"]').focus();
  }

  function removeItem(btn) {
    const list = document.getElementById('ship-list');
    if (list.children.length <= 1) {
      // 最後の1行はクリアするだけ
      const inputs = btn.closest('.ship-item').querySelectorAll('input');
      inputs.forEach(i => i.value = '');
    } else {
      btn.closest('.ship-item').remove();
    }
  }

  function fmtTime(t) {
    if (!t) return '−';
    const [h, m] = t.split(':');
    return `${h}:${m}`;
  }

  function fmtYen(v) {
    const n = parseInt(v, 10);
    if (isNaN(n)) return '−';
    return '¥' + n.toLocaleString('ja-JP');
  }

  function buildText() {
    const now = new Date();
    const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${'日月火水木金土'[now.getDay()]}）`;

    const staff    = document.getElementById('staff').value.trim() || '（未入力）';
    const timeFrom = fmtTime(document.getElementById('time-from').value);
    const timeTo   = fmtTime(document.getElementById('time-to').value);
    const sales    = fmtYen(document.getElementById('sales').value);
    const report   = document.getElementById('report').value.trim() || '（なし）';

    // 発送リスト
    const items = [];
    document.querySelectorAll('#ship-list .ship-item').forEach(row => {
      const name = row.querySelector('input[type="text"]').value.trim();
      const qty  = row.querySelector('input[type="number"]').value;
      if (name && qty) items.push(`　・${name}　${qty}個`);
    });
    const shipStr = items.length ? items.join('\n') : '　なし';

    return [
      `📋 販売日報`,
      `━━━━━━━━━━━━━━━`,
      `📅 日付　　${dateStr}`,
      `👤 担当者　${staff}`,
      `🕐 勤務時間　${timeFrom} 〜 ${timeTo}`,
      `━━━━━━━━━━━━━━━`,
      `💴 売上金額　${sales}`,
      `━━━━━━━━━━━━━━━`,
      `📝 今日の報告`,
      report,
      `━━━━━━━━━━━━━━━`,
      `📦 追加発送依頼`,
      shipStr,
      `━━━━━━━━━━━━━━━`,
      `Victorian Café / 株式会社ハイクオリティー`,
    ].join('\n');
  }

  function submitReport() {
    const staff = document.getElementById('staff').value.trim();
    if (!staff) {
      alert('担当者名を入力してください。');
      document.getElementById('staff').focus();
      return;
    }

    const text = buildText();
    document.getElementById('preview-text').textContent = text;
    document.getElementById('preview-wrap').style.display = 'block';

    const now = new Date();
    document.getElementById('modal-time').textContent =
      `作成日時：${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;

    document.getElementById('overlay').classList.add('show');
    document.getElementById('preview-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('preview-wrap').scrollIntoView({ behavior: 'smooth' });
  }

  function copyText() {
    const text = document.getElementById('preview-text').textContent;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('.copy-btn');
      btn.textContent = '✅ コピーしました！';
      setTimeout(() => btn.innerHTML = '📋 テキストをコピー', 2000);
    });
  }
</script>
</body>
</html>
