<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💐 Victorian 経費管理</title>
  <meta name="description" content="株式会社Victorian 経費管理アプリ">

  <!-- PWA対応 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Victorian経費">
  <meta name="theme-color" content="#e8638c">

  <!-- ファビコン（ピンク花） -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💐</text></svg>">

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; background: #fdf2f6; font-family: 'Hiragino Sans', 'Meiryo', sans-serif; }
    input, select, textarea, button { font-family: inherit; }
    input[type=date]::-webkit-calendar-picker-indicator { cursor: pointer; }
    ::-webkit-scrollbar { height: 4px; width: 4px; }
    ::-webkit-scrollbar-track { background: #fde8ef; }
    ::-webkit-scrollbar-thumb { background: #e8638c; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;


// ===================== デザイントークン =====================
const C = {
  primary:    "#e8638c",   // メインピンク
  primaryDk:  "#c94b74",   // 濃いピンク
  primaryLt:  "#fde8ef",   // 薄いピンク背景
  accent:     "#f9a8c4",   // アクセントピンク
  rose:       "#fdf2f6",   // ページ背景
  mint:       "#3dba8c",   // 支払済み緑
  mintLt:     "#e8faf4",
  warn:       "#f0923a",   // 警告オレンジ
  danger:     "#e05572",   // エラー赤
  navy:       "#3a2a3e",   // 見出し暗色
  gray:       "#7a6a7a",   // サブテキスト
  border:     "#f0d8e4",   // ボーダー
  white:      "#ffffff",
  cardShadow: "0 2px 12px rgba(232,99,140,0.10)",
};

const DEPT_COLORS  = { "セントラルキッチン": "#f0923a", "カフェ店舗": "#e8638c", "会社": "#a06bbf" };
const DEPT_BG      = { "セントラルキッチン": "#fff6ee", "カフェ店舗": "#fde8ef", "会社": "#f3eaff" };

// ===================== 定数 =====================
const DEPARTMENTS  = ["セントラルキッチン", "カフェ店舗", "会社"];
const CATEGORIES   = ["消耗品費","仕入高","荷造運賃","広告宣伝費","通信費","旅費交通費","接待交際費","水道光熱費","修繕費","外注費","雑費","その他"];
const TAX_OPTIONS  = [{ label: "10%", value: 0.1 }, { label: "8%", value: 0.08 }, { label: "非課税", value: 0 }];
const PAYMENT_TYPES = ["現金", "デビット", "後払い"];
const DEFAULT_BANKS    = ["楽天銀行", "ゆうちょ銀行", "三菱UFJ", "みずほ", "PayPay銀行"];
const DEFAULT_DEFERRED = ["メルペイ後払い", "Paidy", "NP後払い", "ネットプロテクションズ"];
const DEFAULT_BILL_ITEMS = {
  "セントラルキッチン": ["電気", "ガス", "水道", "電話・通信"],
  "カフェ店舗":         ["電気", "ガス", "水道", "電話・通信"],
  "会社":               ["電気", "水道", "電話・通信", "インターネット"]
};
const STORAGE = { purchases:"hq_purchases_v1", bills:"hq_bills_v1", banks:"hq_banks_v1", deferred:"hq_deferred_v1", billItems:"hq_bill_items_v1" };

const EMPTY_PURCHASE = { date: new Date().toISOString().slice(0,10), department:"カフェ店舗", shop:"", amount:"", paymentType:"現金", bank:"", customBank:"", deferredService:"", customDeferred:"", taxRate:0.1, category:"消耗品費", yayoiDone:false, paid:false, paymentDueDate:"", memo:"" };
const EMPTY_BILL     = { department:"カフェ店舗", item:"電気", customItem:"", billingDate: new Date().toISOString().slice(0,10), dueDate:"", amount:"", taxRate:0.1, category:"水道光熱費", paid:false, paidDate:"", memo:"" };

// ===================== ユーティリティ =====================
function calcTax(amount, rate) {
  const n = parseFloat(amount);
  if (!n || isNaN(n)) return { net:0, tax:0, total:0 };
  if (rate === 0) return { net:n, tax:0, total:n };
  const net = Math.round(n / (1 + rate));
  return { net, tax: n - net, total: n };
}
function fmt(n) { return Number(n||0).toLocaleString("ja-JP"); }
function monthKey(d) { return d ? d.slice(0,7) : ""; }
function getMonths(purchases, bills) {
  const s = new Set();
  [...purchases,...bills].forEach(r => { if (r.date||r.billingDate) s.add(monthKey(r.date||r.billingDate)); });
  return Array.from(s).sort().reverse();
}
function loadS(key, fb) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fb; } catch { return fb; } }
function saveS(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

// ===================== メインアプリ =====================
function App() {
  const [purchases, setPurchases] = useState(() => loadS(STORAGE.purchases, []));
  const [bills,     setBills]     = useState(() => loadS(STORAGE.bills, []));
  const [banks,     setBanks]     = useState(() => loadS(STORAGE.banks, DEFAULT_BANKS));
  const [deferred,  setDeferred]  = useState(() => loadS(STORAGE.deferred, DEFAULT_DEFERRED));
  const [billItems, setBillItems] = useState(() => loadS(STORAGE.billItems, DEFAULT_BILL_ITEMS));
  const [tab, setTab]             = useState("purchase");
  const [toast, setToast]         = useState(null);
  const toastRef = useRef(null);

  useEffect(() => saveS(STORAGE.purchases, purchases), [purchases]);
  useEffect(() => saveS(STORAGE.bills,     bills),     [bills]);
  useEffect(() => saveS(STORAGE.banks,     banks),     [banks]);
  useEffect(() => saveS(STORAGE.deferred,  deferred),  [deferred]);
  useEffect(() => saveS(STORAGE.billItems, billItems), [billItems]);

  function showToast(msg, color = C.mint) {
    setToast({ msg, color });
    clearTimeout(toastRef.current);
    toastRef.current = setTimeout(() => setToast(null), 2500);
  }

  const unpaidBills = bills.filter(b => !b.paid).length;
  const unyayoi     = purchases.filter(p => !p.yayoiDone).length;

  const TABS = [["purchase","🛒","購入記録"],["bill","📄","請求書"],["report","📊","月次"],["settings","⚙️","設定"]];

  return (
    <div style={{ fontFamily:"'Hiragino Sans','Meiryo',sans-serif", background: C.rose, minHeight:"100vh", maxWidth:700, margin:"0 auto" }}>

      {/* ヘッダー */}
      <div style={{ background:`linear-gradient(135deg, ${C.primaryDk} 0%, ${C.primary} 60%, ${C.accent} 100%)`, color:C.white, padding:"18px 18px 14px", position:"relative", overflow:"hidden" }}>
        <div style={{ position:"absolute", top:-30, right:-20, width:120, height:120, borderRadius:"50%", background:"rgba(255,255,255,0.08)" }} />
        <div style={{ position:"absolute", bottom:-40, left:-10, width:100, height:100, borderRadius:"50%", background:"rgba(255,255,255,0.06)" }} />
        <div style={{ fontSize:11, letterSpacing:3, opacity:0.8, marginBottom:4, textTransform:"uppercase" }}>株式会社Victorian</div>
        <div style={{ fontSize:19, fontWeight:800, letterSpacing:0.5 }}>💐 経費管理</div>
        <div style={{ display:"flex", gap:8, marginTop:12, flexWrap:"wrap" }}>
          <Pill label="請求書 未払い" count={unpaidBills} bg="rgba(255,255,255,0.22)" />
          <Pill label="弥生 未記録"   count={unyayoi}     bg="rgba(255,255,255,0.22)" />
          <Pill label="購入記録"      count={purchases.length} bg="rgba(255,255,255,0.13)" />
        </div>
      </div>

      {/* タブバー */}
      <div style={{ display:"flex", background:C.white, borderBottom:`2px solid ${C.border}`, boxShadow:"0 2px 8px rgba(232,99,140,0.07)" }}>
        {TABS.map(([k,icon,label]) => (
          <button key={k} onClick={() => setTab(k)} style={{
            flex:1, padding:"11px 4px 9px", border:"none", background:"none", cursor:"pointer",
            fontSize:12, color: tab===k ? C.primary : C.gray,
            fontWeight: tab===k ? 700 : 400,
            borderBottom: `3px solid ${tab===k ? C.primary : "transparent"}`,
            transition:"color 0.2s, border-color 0.2s",
          }}>
            <div style={{ fontSize:16 }}>{icon}</div>
            <div style={{ marginTop:1 }}>{label}</div>
          </button>
        ))}
      </div>

      <div style={{ padding:"14px 13px 96px" }}>
        {tab==="purchase" && <PurchaseTab purchases={purchases} setPurchases={setPurchases} banks={banks} deferred={deferred} showToast={showToast} />}
        {tab==="bill"     && <BillTab     bills={bills} setBills={setBills} billItems={billItems} setBillItems={setBillItems} showToast={showToast} />}
        {tab==="report"   && <ReportTab   purchases={purchases} bills={bills} />}
        {tab==="settings" && <SettingsTab banks={banks} setBanks={setBanks} deferred={deferred} setDeferred={setDeferred} billItems={billItems} setBillItems={setBillItems} setPurchases={setPurchases} setBills={setBills} showToast={showToast} />}
      </div>

      {toast && (
        <div style={{ position:"fixed", bottom:90, left:"50%", transform:"translateX(-50%)", background:toast.color, color:C.white, borderRadius:28, padding:"11px 24px", fontSize:14, fontWeight:700, boxShadow:"0 4px 20px rgba(0,0,0,0.18)", zIndex:200, whiteSpace:"nowrap", letterSpacing:0.5 }}>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

// ===================== 購入記録タブ =====================
function PurchaseTab({ purchases, setPurchases, banks, deferred, showToast }) {
  const [mode, setMode]         = useState("list");
  const [form, setForm]         = useState(EMPTY_PURCHASE);
  const [editId, setEditId]     = useState(null);
  const [filterDept, setFD]     = useState("all");
  const [filterStatus, setFS]   = useState("all");
  const [confirmDel, setCD]     = useState(null);

  function hc(e) { const { name, value, type, checked } = e.target; setForm(f=>({...f,[name]:type==="checkbox"?checked:value})); }

  function handleSubmit() {
    if (!form.shop.trim()||!form.amount) { showToast("店名と金額は必須です", C.danger); return; }
    const bank = form.paymentType==="デビット"?(form.bank==="__custom__"?form.customBank:form.bank):"";
    const ds   = form.paymentType==="後払い"?(form.deferredService==="__custom__"?form.customDeferred:form.deferredService):"";
    if (editId!==null) {
      setPurchases(ps=>ps.map(p=>p.id===editId?{...form,bank,deferredService:ds,id:editId}:p));
      showToast("✓ 更新しました"); setEditId(null);
    } else {
      setPurchases(ps=>[{...form,bank,deferredService:ds,id:Date.now()},...ps]);
      showToast("✓ 追加しました");
    }
    setForm({...EMPTY_PURCHASE,date:form.date,department:form.department}); setMode("list");
  }

  function startEdit(r) {
    const bv = banks.includes(r.bank)?r.bank:(r.bank?"__custom__":"");
    const dv = deferred.includes(r.deferredService)?r.deferredService:(r.deferredService?"__custom__":"");
    setForm({...r,bank:bv,customBank:banks.includes(r.bank)?"":r.bank,deferredService:dv,customDeferred:deferred.includes(r.deferredService)?"":r.deferredService});
    setEditId(r.id); setMode("add");
  }

  function doDelete(id) { setPurchases(ps=>ps.filter(p=>p.id!==id)); setCD(null); showToast("削除しました","#aaa"); }

  function exportCSV(list) {
    const hdr = ["日付","部門","店名","金額(税込)","税抜","消費税","税率","支払方法","詳細","科目","弥生記録","入金済","入金予定日","メモ"];
    const rows = list.map(r=>{
      const {net,tax}=calcTax(r.amount,r.taxRate);
      const det=r.paymentType==="デビット"?r.bank:r.paymentType==="後払い"?r.deferredService:"";
      return [r.date,r.department,r.shop,r.amount,net,tax,r.taxRate===0?"非課税":`${r.taxRate*100}%`,r.paymentType,det,r.category,r.yayoiDone?"済":"未",r.paid?"済":"未",r.paymentDueDate||"",r.memo||""].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",");
    });
    const blob=new Blob(["\uFEFF"+[hdr.join(","),...rows].join("\n")],{type:"text/csv;charset=utf-8;"});
    Object.assign(document.createElement("a"),{href:URL.createObjectURL(blob),download:`購入記録_${new Date().toISOString().slice(0,10)}.csv`}).click();
    showToast("📥 CSV出力しました");
  }

  const filtered = purchases.filter(p=>{
    if (filterDept!=="all"&&p.department!==filterDept) return false;
    if (filterStatus==="unyayoi"&&p.yayoiDone) return false;
    if (filterStatus==="unpaid"&&(p.paid||p.paymentType!=="後払い")) return false;
    return true;
  }).sort((a,b)=>b.date.localeCompare(a.date));

  if (mode==="add") return <PurchaseForm form={form} editId={editId} onChange={hc} onSubmit={handleSubmit} onCancel={()=>{setMode("list");setEditId(null);setForm(EMPTY_PURCHASE);}} banks={banks} deferred={deferred} setForm={setForm} />;

  return (
    <>
      <ScrollRow>
        {[["all","すべて"],...DEPARTMENTS.map(d=>[d,d])].map(([k,l])=>(
          <Chip key={k} label={l} active={filterDept===k} color={DEPT_COLORS[k]||C.primary} onClick={()=>setFD(k)} />
        ))}
      </ScrollRow>
      <ScrollRow style={{marginTop:7}}>
        {[["all","全件"],["unyayoi","弥生未記録"],["unpaid","後払い未入金"]].map(([k,l])=>(
          <Chip key={k} label={l} active={filterStatus===k} color={C.primary} onClick={()=>setFS(k)} />
        ))}
        <button onClick={()=>exportCSV(filtered)} style={csvBtn}>📥 CSV</button>
      </ScrollRow>

      {filtered.length>0 && (
        <div style={{fontSize:13,color:C.gray,textAlign:"right",margin:"8px 0 4px"}}>
          合計: <strong style={{color:C.primary}}>¥{fmt(filtered.reduce((s,r)=>s+(parseFloat(r.amount)||0),0))}</strong>（{filtered.length}件）
        </div>
      )}

      {filtered.length===0 ? <Empty text="記録がありません" /> : filtered.map(r=>(
        <PurchaseCard key={r.id} r={r}
          onEdit={()=>startEdit(r)}
          onToggleYayoi={()=>setPurchases(ps=>ps.map(p=>p.id===r.id?{...p,yayoiDone:!p.yayoiDone}:p))}
          onTogglePaid={()=>setPurchases(ps=>ps.map(p=>p.id===r.id?{...p,paid:!p.paid}:p))}
          onDelete={()=>setCD(r.id)} />
      ))}

      <Fab onClick={()=>{setForm(EMPTY_PURCHASE);setEditId(null);setMode("add");}} />
      <Confirm open={confirmDel} onCancel={()=>setCD(null)} onConfirm={()=>doDelete(confirmDel)} />
    </>
  );
}

function PurchaseForm({ form, editId, onChange, onSubmit, onCancel, banks, deferred, setForm }) {
  return (
    <FormCard title={editId!==null?"✏️ 購入記録を編集":"✨ 新規購入記録"}>
      <Lbl>購入日</Lbl>
      <input type="date" name="date" value={form.date} onChange={onChange} style={IS} />
      <Lbl>部門 *</Lbl>
      <DeptSel value={form.department} onChange={v=>setForm(f=>({...f,department:v}))} />
      <Lbl>店名・サービス名 *</Lbl>
      <input type="text" name="shop" value={form.shop} onChange={onChange} placeholder="例：Amazon、楽天市場" style={IS} />
      <Lbl>金額（税込） *</Lbl>
      <input type="number" name="amount" value={form.amount} onChange={onChange} placeholder="例：1980" style={IS} />
      <TaxPrev amount={form.amount} rate={form.taxRate} />
      <Lbl>消費税</Lbl>
      <TaxSel value={form.taxRate} onChange={v=>setForm(f=>({...f,taxRate:v}))} />
      <Lbl>支払方法</Lbl>
      <PaySel value={form.paymentType} onChange={v=>setForm(f=>({...f,paymentType:v}))} />
      {form.paymentType==="デビット" && <BankSel form={form} onChange={onChange} banks={banks} />}
      {form.paymentType==="後払い"   && <DefSel  form={form} onChange={onChange} deferred={deferred} />}
      <Lbl>勘定科目</Lbl>
      <select name="category" value={form.category} onChange={onChange} style={IS}>{CATEGORIES.map(c=><option key={c}>{c}</option>)}</select>
      <div style={{display:"flex",gap:10,marginBottom:14}}>
        <ChkToggle label="弥生に記録済み" name="yayoiDone" checked={form.yayoiDone} onChange={onChange} color={C.primary} />
        <ChkToggle label="入金済み"       name="paid"      checked={form.paid}      onChange={onChange} color={C.mint}    />
      </div>
      <Lbl>メモ</Lbl>
      <textarea name="memo" value={form.memo} onChange={onChange} rows={2} placeholder="備考、注文番号など" style={{...IS,resize:"vertical"}} />
      <FormBtns onCancel={onCancel} onSubmit={onSubmit} isEdit={editId!==null} />
    </FormCard>
  );
}

function PurchaseCard({ r, onEdit, onToggleYayoi, onTogglePaid, onDelete }) {
  const { net } = calcTax(r.amount, r.taxRate);
  const dc = DEPT_COLORS[r.department]||C.primary;
  const payLabel = r.paymentType==="デビット"?`${r.paymentType}（${r.bank}）`:r.paymentType==="後払い"?`${r.paymentType}（${r.deferredService}）`:r.paymentType;
  const leftColor = !r.yayoiDone ? C.danger : (!r.paid&&r.paymentType==="後払い") ? C.warn : C.mint;

  return (
    <div style={{ background:C.white, borderRadius:14, marginBottom:10, padding:14, boxShadow:C.cardShadow, borderLeft:`4px solid ${leftColor}` }}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div style={{flex:1}}>
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3,flexWrap:"wrap"}}>
            <span style={{background:dc,color:C.white,fontSize:10,borderRadius:12,padding:"2px 9px",fontWeight:700,letterSpacing:0.5}}>{r.department}</span>
            <span style={{fontWeight:700,fontSize:15,color:C.navy}}>{r.shop}</span>
          </div>
          <div style={{fontSize:12,color:C.gray}}>{r.date}　{r.category}　{payLabel}</div>
        </div>
        <div style={{textAlign:"right",flexShrink:0,marginLeft:8}}>
          <div style={{fontWeight:800,fontSize:17,color:C.navy}}>¥{fmt(r.amount)}</div>
          {r.taxRate>0 && <div style={{fontSize:11,color:"#bbb"}}>税抜¥{fmt(net)}</div>}
          {r.taxRate===0 && <div style={{fontSize:11,color:"#bbb"}}>非課税</div>}
        </div>
      </div>
      {r.paymentDueDate&&r.paymentType==="後払い" && <div style={{fontSize:12,color:C.warn,marginTop:4}}>📅 入金予定: {r.paymentDueDate}</div>}
      {r.memo && <div style={{fontSize:12,color:C.gray,marginTop:3,fontStyle:"italic"}}>💬 {r.memo}</div>}
      <div style={{display:"flex",gap:6,marginTop:10,flexWrap:"wrap"}}>
        <MiniToggle label="弥生" done={r.yayoiDone} onClick={onToggleYayoi} ac={C.primary} />
        {r.paymentType==="後払い" && <MiniToggle label="入金" done={r.paid} onClick={onTogglePaid} ac={C.mint} />}
        <PillBtn onClick={onEdit} bg="#f9f0f5" color={C.gray}>✏️ 編集</PillBtn>
        <PillBtn onClick={onDelete} bg="#fff0f4" color={C.danger} style={{marginLeft:"auto"}}>🗑</PillBtn>
      </div>
    </div>
  );
}

// ===================== 請求書タブ =====================
function BillTab({ bills, setBills, billItems, setBillItems, showToast }) {
  const [mode,setMode]       = useState("list");
  const [form,setForm]       = useState(EMPTY_BILL);
  const [editId,setEditId]   = useState(null);
  const [filterDept,setFD]   = useState("all");
  const [filterStatus,setFS] = useState("all");
  const [confirmDel,setCD]   = useState(null);

  function hc(e){ const{name,value,type,checked}=e.target; setForm(f=>({...f,[name]:type==="checkbox"?checked:value})); }

  function handleSubmit() {
    if (!form.amount){ showToast("金額は必須です",C.danger); return; }
    const item = form.item==="__custom__"?form.customItem:form.item;
    if (editId!==null){ setBills(bs=>bs.map(b=>b.id===editId?{...form,item,id:editId}:b)); showToast("✓ 更新しました"); setEditId(null); }
    else              { setBills(bs=>[{...form,item,id:Date.now()},...bs]); showToast("✓ 追加しました"); }
    setForm({...EMPTY_BILL,department:form.department}); setMode("list");
  }

  function startEdit(b){
    const items=billItems[b.department]||[];
    const iv=items.includes(b.item)?b.item:(b.item?"__custom__":"");
    setForm({...b,item:iv,customItem:items.includes(b.item)?"":b.item});
    setEditId(b.id); setMode("add");
  }

  function doDelete(id){ setBills(bs=>bs.filter(b=>b.id!==id)); setCD(null); showToast("削除しました","#aaa"); }
  function togglePaid(id){ setBills(bs=>bs.map(b=>{ if(b.id!==id)return b; return {...b,paid:!b.paid,paidDate:!b.paid?new Date().toISOString().slice(0,10):""}; })); }

  const filtered = bills.filter(b=>{
    if (filterDept!=="all"&&b.department!==filterDept) return false;
    if (filterStatus==="unpaid"&&b.paid)  return false;
    if (filterStatus==="paid"&&!b.paid)   return false;
    return true;
  }).sort((a,b)=>(b.billingDate||"").localeCompare(a.billingDate||""));

  if (mode==="add") return <BillForm form={form} editId={editId} onChange={hc} onSubmit={handleSubmit} onCancel={()=>{setMode("list");setEditId(null);setForm(EMPTY_BILL);}} billItems={billItems} setForm={setForm} />;

  return (
    <>
      <ScrollRow>
        {[["all","すべて"],...DEPARTMENTS.map(d=>[d,d])].map(([k,l])=>(
          <Chip key={k} label={l} active={filterDept===k} color={DEPT_COLORS[k]||C.primary} onClick={()=>setFD(k)} />
        ))}
      </ScrollRow>
      <ScrollRow style={{marginTop:7}}>
        {[["all","全件"],["unpaid","未払い"],["paid","支払済み"]].map(([k,l])=>(
          <Chip key={k} label={l} active={filterStatus===k} color={k==="unpaid"?C.danger:k==="paid"?C.mint:C.primary} onClick={()=>setFS(k)} />
        ))}
      </ScrollRow>
      {filtered.length===0 ? <Empty text="請求書がありません" /> : filtered.map(b=>(
        <BillCard key={b.id} b={b} onEdit={()=>startEdit(b)} onTogglePaid={()=>togglePaid(b.id)} onDelete={()=>setCD(b.id)} />
      ))}
      <Fab onClick={()=>{setForm(EMPTY_BILL);setEditId(null);setMode("add");}} />
      <Confirm open={confirmDel} onCancel={()=>setCD(null)} onConfirm={()=>doDelete(confirmDel)} />
    </>
  );
}

function BillCard({ b, onEdit, onTogglePaid, onDelete }) {
  const dc = DEPT_COLORS[b.department]||C.primary;
  const isOverdue = !b.paid&&b.dueDate&&b.dueDate<new Date().toISOString().slice(0,10);
  const leftColor = b.paid ? C.mint : isOverdue ? C.danger : C.warn;

  return (
    <div style={{ background: b.paid ? C.mintLt : C.white, borderRadius:14, marginBottom:10, padding:14, boxShadow:C.cardShadow, borderLeft:`4px solid ${leftColor}` }}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div style={{flex:1}}>
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3,flexWrap:"wrap"}}>
            <span style={{background:dc,color:C.white,fontSize:10,borderRadius:12,padding:"2px 9px",fontWeight:700}}>{b.department}</span>
            <span style={{fontWeight:700,fontSize:15,color:C.navy}}>{b.item}</span>
            {isOverdue && <span style={{background:C.danger,color:C.white,fontSize:10,borderRadius:10,padding:"2px 8px",fontWeight:700}}>期限超過</span>}
          </div>
          <div style={{fontSize:12,color:C.gray}}>請求日: {b.billingDate}　{b.category}</div>
          {b.dueDate && <div style={{fontSize:12,color:isOverdue?C.danger:C.gray}}>支払期限: {b.dueDate}</div>}
          {b.paid&&b.paidDate && <div style={{fontSize:12,color:C.mint,fontWeight:600}}>✓ 支払済み: {b.paidDate}</div>}
        </div>
        <div style={{textAlign:"right",flexShrink:0,marginLeft:8}}>
          <div style={{fontWeight:800,fontSize:17,color:C.navy}}>¥{fmt(b.amount)}</div>
          {b.taxRate>0 && <div style={{fontSize:11,color:"#bbb"}}>税抜¥{fmt(calcTax(b.amount,b.taxRate).net)}</div>}
        </div>
      </div>
      {b.memo && <div style={{fontSize:12,color:C.gray,marginTop:3,fontStyle:"italic"}}>💬 {b.memo}</div>}
      <div style={{display:"flex",gap:6,marginTop:10,flexWrap:"wrap"}}>
        <button onClick={onTogglePaid} style={{
          padding:"6px 14px", borderRadius:20, fontSize:12, cursor:"pointer", fontWeight:700, border:"none",
          background: b.paid ? C.mint : C.primaryLt,
          color: b.paid ? C.white : C.primary,
          boxShadow: b.paid ? "0 2px 8px rgba(61,186,140,0.3)" : "0 2px 8px rgba(232,99,140,0.15)"
        }}>
          {b.paid ? "✓ 支払済み" : "未払い → 支払済みに"}
        </button>
        <PillBtn onClick={onEdit} bg="#f9f0f5" color={C.gray}>✏️</PillBtn>
        <PillBtn onClick={onDelete} bg="#fff0f4" color={C.danger} style={{marginLeft:"auto"}}>🗑</PillBtn>
      </div>
    </div>
  );
}

// ===================== 月次レポート =====================
function ReportTab({ purchases, bills }) {
  const months = getMonths(purchases, bills);
  const [month, setMonth] = useState(months[0]||new Date().toISOString().slice(0,7));

  const mp = purchases.filter(r=>monthKey(r.date)===month);
  const mb = bills.filter(b=>monthKey(b.billingDate)===month);
  const allItems = [...mp.map(r=>({...r,source:"purchase",amount:parseFloat(r.amount)||0})),...mb.map(b=>({...b,source:"bill",amount:parseFloat(b.amount)||0}))];
  const totalAll = allItems.reduce((s,r)=>s+r.amount,0);
  const byDept   = {};
  DEPARTMENTS.forEach(d=>{ byDept[d]=allItems.filter(r=>r.department===d).reduce((s,r)=>s+r.amount,0); });
  const byCat = {};
  allItems.forEach(r=>{ byCat[r.category]=(byCat[r.category]||0)+r.amount; });
  const unpaidBills = mb.filter(b=>!b.paid);

  return (
    <div>
      <div style={{background:C.white,borderRadius:12,padding:"10px 14px",marginBottom:12,display:"flex",alignItems:"center",gap:10,boxShadow:C.cardShadow}}>
        <span style={{fontSize:13,color:C.gray,fontWeight:600,whiteSpace:"nowrap"}}>表示月：</span>
        <select value={month} onChange={e=>setMonth(e.target.value)} style={{...IS,marginBottom:0,flex:1}}>
          {months.length===0?<option>データなし</option>:months.map(m=><option key={m}>{m}</option>)}
        </select>
      </div>

      {months.length===0 ? <Empty text="データがありません" /> : (
        <>
          <div style={{background:`linear-gradient(135deg,${C.primaryDk},${C.primary})`,color:C.white,borderRadius:16,padding:"20px 20px 16px",marginBottom:14,position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",top:-20,right:-20,width:100,height:100,borderRadius:"50%",background:"rgba(255,255,255,0.1)"}} />
            <div style={{fontSize:13,opacity:0.8}}>{month} 経費合計</div>
            <div style={{fontSize:30,fontWeight:900,marginTop:2}}>¥{fmt(totalAll)}</div>
            <div style={{fontSize:12,opacity:0.7,marginTop:6}}>購入記録 {mp.length}件　請求書 {mb.length}件</div>
          </div>

          <SectionCard title="🏢 部門別">
            {DEPARTMENTS.map(d=>(
              <div key={d} style={{display:"flex",alignItems:"center",marginBottom:12}}>
                <div style={{width:5,height:38,borderRadius:3,background:DEPT_COLORS[d],marginRight:10,flexShrink:0}} />
                <div style={{flex:1}}>
                  <div style={{display:"flex",justifyContent:"space-between"}}>
                    <span style={{fontSize:14,fontWeight:700,color:C.navy}}>{d}</span>
                    <span style={{fontSize:14,fontWeight:800,color:DEPT_COLORS[d]}}>¥{fmt(byDept[d])}</span>
                  </div>
                  <div style={{background:C.border,borderRadius:4,height:7,marginTop:5}}>
                    <div style={{background:DEPT_COLORS[d],borderRadius:4,height:7,width:`${totalAll>0?Math.round(byDept[d]/totalAll*100):0}%`,transition:"width 0.5s"}} />
                  </div>
                  <div style={{fontSize:11,color:C.gray,textAlign:"right",marginTop:2}}>{totalAll>0?Math.round(byDept[d]/totalAll*100):0}%</div>
                </div>
              </div>
            ))}
          </SectionCard>

          <SectionCard title="📂 科目別">
            {Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>(
              <div key={cat} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${C.border}`}}>
                <span style={{fontSize:13,color:C.gray}}>{cat}</span>
                <span style={{fontSize:14,fontWeight:800,color:C.navy}}>¥{fmt(amt)}</span>
              </div>
            ))}
          </SectionCard>

          {unpaidBills.length>0 && (
            <SectionCard title={`⚠️ 未払い請求書（${unpaidBills.length}件）`}>
              {unpaidBills.map(b=>(
                <div key={b.id} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:`1px solid ${C.border}`}}>
                  <div>
                    <span style={{fontSize:11,background:DEPT_COLORS[b.department],color:C.white,borderRadius:10,padding:"1px 8px",marginRight:6}}>{b.department}</span>
                    <span style={{fontSize:13,color:C.navy,fontWeight:600}}>{b.item}</span>
                    {b.dueDate && <div style={{fontSize:11,color:C.danger}}>期限: {b.dueDate}</div>}
                  </div>
                  <span style={{fontWeight:800,color:C.danger}}>¥{fmt(b.amount)}</span>
                </div>
              ))}
            </SectionCard>
          )}
        </>
      )}
    </div>
  );
}

      boxShadow:`0 4px 20px ${C.primary}66`,cursor:"pointer",
      display:"flex",alignItems:"center",justifyContent:"center",zIndex:50,
      transition:"transform 0.15s",
    }}>＋</button>
  );
}
function Confirm({ open, onCancel, onConfirm }) {
  if (!open) return null;
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100}}>
      <div style={{background:C.white,borderRadius:20,padding:28,maxWidth:300,width:"90%",textAlign:"center",boxShadow:"0 8px 40px rgba(0,0,0,0.15)"}}>
        <div style={{fontSize:17,fontWeight:800,color:C.navy,marginBottom:8}}>削除しますか？</div>
        <div style={{fontSize:13,color:C.gray,marginBottom:22}}>元に戻せません</div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={onCancel}  style={{flex:1,padding:11,borderRadius:12,border:`2px solid ${C.border}`,background:C.white,color:C.gray,cursor:"pointer",fontWeight:600}}>キャンセル</button>
          <button onClick={onConfirm} style={{flex:1,padding:11,borderRadius:12,border:"none",background:C.danger,color:C.white,fontWeight:800,cursor:"pointer",boxShadow:`0 3px 12px ${C.danger}44`}}>削除</button>
        </div>
      </div>
    </div>
  );
}
function SettingRow({ label, onDelete }) {
  return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:C.rose,borderRadius:10,padding:"9px 13px",marginBottom:6,fontSize:14,color:C.navy}}>
      {label}
      <button onClick={onDelete} style={{background:"none",border:"none",color:C.danger,cursor:"pointer",fontSize:18,lineHeight:1,padding:"0 4px"}}>×</button>
    </div>
  );
}
function AddRow({ value, onChange, placeholder, onAdd }) {
  return (
    <div style={{display:"flex",gap:8,marginTop:8}}>
      <input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{...IS,marginBottom:0,flex:1}} />
      <button onClick={onAdd} style={addBtn}>追加</button>
    </div>
  );
}

const IS = { width:"100%", boxSizing:"border-box", padding:"11px 13px", borderRadius:10, border:`2px solid #f0d8e4`, fontSize:15, marginBottom:14, background:"#fdfafc", outline:"none", color:"#3a2a3e" };
const addBtn = { padding:"0 16px", borderRadius:10, background:`linear-gradient(135deg,#c94b74,#e8638c)`, color:"#fff", border:"none", cursor:"pointer", fontSize:13, fontWeight:700, whiteSpace:"nowrap", boxShadow:"0 2px 10px rgba(232,99,140,0.35)" };
const delBtn = { width:"100%", padding:11, borderRadius:10, background:"#fff", fontWeight:700, cursor:"pointer", fontSize:13, border:"1.5px solid" };
const csvBtn = { marginLeft:"auto", padding:"6px 14px", borderRadius:22, border:"none", background:`linear-gradient(135deg,#3dba8c,#2da57a)`, color:"#fff", fontSize:12, cursor:"pointer", whiteSpace:"nowrap", fontWeight:700, boxShadow:"0 2px 8px rgba(61,186,140,0.35)", flexShrink:0 };


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
